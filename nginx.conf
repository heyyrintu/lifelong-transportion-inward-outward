server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The dashboard is ~400 KB of mostly JSON/JS text — compress it.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/html application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the HTML so redeploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Basic hardening.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
}
